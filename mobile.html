<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>C1 생산 현황 (모바일)</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #ffffff;
    --bg-panel: #f0f2f5;
    --bg-card: #ffffff;
    --bg-card2: #f5f6f9;
    --border: #b8c2d0;
    --border-bright: #8a97aa;
    --accent: #0099cc;
    --accent2: #0077aa;
    --accent-dim: rgba(0,153,204,0.13);
    --green: #00aa55;
    --green-dim: rgba(0,170,85,0.13);
    --yellow: #cc8800;
    --yellow-dim: rgba(204,136,0,0.10);
    --red: #dd1133;
    --red-dim: rgba(221,17,51,0.13);
    --orange: #dd5500;
    --orange-dim: rgba(221,85,0,0.10);
    --navy: #0d1f3c;
    --text-primary: #0d1821;
    --text-secondary: #1e2e45;
    --text-dim: #5b6b7d;
    --font-mono: 'Share Tech Mono', monospace;
    --font-main: 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg-panel); color:var(--text-primary); font-family:var(--font-main); }
  body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  /* ── 상단 고정바 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--navy);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-left { display:flex; align-items:center; gap:8px; }
  .topbar-title { font-family:var(--font-main); font-weight:900; font-size:16px; color:#fff; letter-spacing:.2px; }
  .topbar-title .ver { font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--accent); border:1px solid var(--accent2); border-radius:3px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .topbar-sub { font-family:var(--font-mono); font-size:10px; color:#8fb8cc; margin-top:1px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(0,170,85,.6); animation: pulse 2s infinite; flex-shrink:0; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(0,170,85,.5);} 70%{box-shadow:0 0 0 7px rgba(0,170,85,0);} 100%{box-shadow:0 0 0 0 rgba(0,170,85,0);} }
  .refresh-btn { background:rgba(255,255,255,.1); border:none; color:#fff; font-size:15px; padding:7px 9px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .refresh-btn:active { background:rgba(255,255,255,.22); }
  .refresh-btn.spin svg { animation: spin .7s linear; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* ── 탭바 (가로 스크롤) */
  .mobile-tabbar {
    position: sticky; top: calc(46px + env(safe-area-inset-top)); z-index: 29;
    display:flex; gap:6px; padding:9px 12px; background:var(--bg-panel);
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    border-bottom:1px solid var(--border);
  }
  .mobile-tabbar::-webkit-scrollbar { display:none; }
  .mtab-btn {
    flex-shrink:0; display:flex; align-items:center; gap:5px;
    padding:8px 14px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--bg-card); color:var(--text-dim); font-family:var(--font-main);
    font-weight:700; font-size:13px; white-space:nowrap;
  }
  .mtab-btn.active { background:var(--navy); border-color:var(--navy); color:#fff; }
  .mtab-btn .mtab-icon { font-size:14px; }

  /* ── 공통 화면 컨테이너 */
  .mobile-view { display:none; padding:12px 16px 20px; }
  .mobile-view.active { display:block; }

  /* ── 자리표시(준비중) 카드 - 각 탭 내용 채우기 전까지 표시 */
  .placeholder-card {
    background:var(--bg-card); border:1px dashed var(--border-bright); border-radius:12px;
    padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.7;
  }
  .placeholder-card .ph-icon { font-size:30px; margin-bottom:10px; display:block; }
  .placeholder-card .ph-title { font-size:15px; font-weight:700; color:var(--text-secondary); margin-bottom:4px; }
  .placeholder-card .ph-icon.spin { display:inline-block; animation: phspin 1.1s linear infinite; }
  @keyframes phspin { from{transform:rotate(0);} to{transform:rotate(360deg);} }

  /* ── 접속 잠금화면 (PC와 동일 컨셉) */
  #viewLockOverlay { display:none; position:fixed; inset:0; z-index:999; background:var(--navy); align-items:center; justify-content:center; padding:20px; }
  .lock-box { background:#fff; border-radius:14px; padding:32px 26px; width:100%; max-width:340px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .lock-box input { width:100%; box-sizing:border-box; padding:12px; font-size:15px; border:1px solid var(--border); border-radius:8px; margin-bottom:10px; text-align:center; }
  .lock-box button { width:100%; padding:12px; background:var(--accent2); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; }

  /* ── 공지판 (접이식) */
  .notice-wrap { margin-bottom:10px; }
  .notice-toggle { display:flex; align-items:center; justify-content:space-between; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:13px; font-weight:700; color:var(--text-secondary); }
  .notice-toggle .chev { transition: transform .2s; color:var(--text-dim); }
  .notice-toggle.open .chev { transform: rotate(180deg); }
  .notice-body { display:none; background:var(--bg-card); border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; padding:12px 14px; margin-top:-1px; }
  .notice-body.open { display:block; }
  .notice-item { font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:10px; }
  .notice-item:last-child { margin-bottom:0; }
  .notice-item .lbl { font-size:11px; font-weight:700; color:var(--text-dim); display:block; margin-bottom:3px; }
  .notice-item .txt { word-break:break-word; }
  .notice-item .txt:empty:before { content:'내용 없음'; color:#bbb; }

  /* ── 총계 스트립 */
  .stat-strip { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .stat-box { flex:1; min-width:84px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; }
  .stat-box .stat-label { font-size:10.5px; color:var(--text-dim); font-weight:700; margin-bottom:4px; }
  .stat-box .stat-value { font-family:var(--font-mono); font-size:18px; font-weight:800; color:var(--text-primary); }
  .stat-box .stat-value .accent { color:var(--accent2); }

  /* ── 섹션 타이틀 */
  .section-title { font-size:14px; font-weight:800; color:var(--navy); margin:14px 0 8px; padding-left:8px; border-left:4px solid var(--accent2); }

  /* ── 모델 카드 */
  .model-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .model-card-head { padding:12px 14px 10px; display:flex; align-items:center; justify-content:space-between; }
  .model-card-name { font-family:var(--font-mono); font-weight:800; color:var(--orange); font-size:17px; }
  .model-card-fullname { font-size:11px; color:var(--text-dim); margin-top:1px; }
  .model-card-qty { font-family:var(--font-mono); font-weight:800; color:var(--orange); background:var(--orange-dim); border:1px solid var(--orange); border-radius:6px; padding:3px 10px; font-size:13px; white-space:nowrap; }
  .model-card-dday-row { display:flex; justify-content:space-between; align-items:center; padding:0 14px 10px; font-size:12px; color:var(--text-dim); }
  .model-card-dday { font-family:var(--font-mono); font-weight:800; font-size:16px; }
  .model-card-progress { display:flex; gap:8px; padding:0 14px 12px; }
  .progress-mini { flex:1; text-align:center; }
  .progress-mini .pm-label { font-size:10.5px; color:var(--text-dim); margin-bottom:3px; }
  .progress-mini .pm-value { font-family:var(--font-mono); font-size:13px; font-weight:800; }
  .progress-mini .pm-bar-bg { height:5px; border-radius:3px; background:var(--bg-card2); margin-top:4px; overflow:hidden; }
  .progress-mini .pm-bar-fill { height:100%; background:var(--green); border-radius:3px; }
  .model-card-note-btn { margin:0 14px 12px; padding:8px; border-radius:8px; text-align:center; font-size:12px; font-weight:700; }
  .model-card-expand-btn { display:block; width:100%; text-align:center; padding:9px; background:var(--bg-card2); border:none; border-top:1px solid var(--border); font-size:12px; color:var(--accent2); font-weight:700; }
  .model-card-detail { display:none; border-top:1px solid var(--border); padding:10px 14px 12px; background:var(--bg-card2); }
  .model-card-detail.open { display:block; }
  .detail-proc-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px; }
  .detail-proc-row:last-child { border-bottom:none; }
  .detail-proc-name { color:var(--text-secondary); font-weight:600; }
  .detail-proc-val { font-family:var(--font-mono); font-weight:700; }
  .detail-proc-val.na { color:#ccc; }
  .empty-note { text-align:center; padding:30px; color:var(--text-dim); font-size:12.5px; background:var(--bg-card); border:1px dashed var(--border-bright); border-radius:12px; }

  /* ── 이미지 갤러리 */
  .gallery-row { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; margin-bottom:14px; }
  .gallery-chip { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:20px; font-size:12.5px; font-weight:700; background:var(--yellow-dim); color:var(--yellow); border:1px solid rgba(204,136,0,.3); }
  .gallery-chip.active-schedule { background:rgba(255,140,0,.13); color:var(--orange); border-color:rgba(255,140,0,.5); animation:imgBlink 1.1s ease-in-out infinite; }
  @keyframes imgBlink { 0%,100%{opacity:1;} 50%{opacity:.45;} }

  /* ── 이미지 뷰어 모달 */
  #imageViewOverlay { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.85); flex-direction:column; }
  #imageViewOverlay.open { display:flex; }
  .iv-header { display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; color:#fff; }
  .iv-title { font-size:15px; font-weight:800; }
  .iv-close { background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:16px; font-size:16px; }
  .iv-body { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:10px; }
  .iv-body img { max-width:100%; max-height:100%; border-radius:8px; }
  .iv-footer { padding:12px 16px calc(14px + env(safe-area-inset-bottom)); color:#ccc; font-size:12px; }
  .iv-footer .iv-desc { color:#fff; margin-bottom:6px; white-space:pre-wrap; }

  /* ── 특이사항 */
  .note-model-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .note-model-head { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:10px 14px; background:var(--bg-card2); border-bottom:1px solid var(--border); }
  .note-model-head .nm-name { font-family:var(--font-mono); font-weight:800; color:#cc3377; font-size:15px; }
  .note-model-head .nm-stat { font-size:11px; font-weight:700; color:var(--text-dim); }
  .note-row { padding:10px 14px; border-bottom:1px solid var(--border); }
  .note-row:last-child { border-bottom:none; }
  .note-row .nr-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .note-row .nr-status { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:8px; }
  .note-row .nr-qty { font-family:var(--font-mono); font-weight:800; color:var(--red); font-size:13px; }
  .note-row .nr-issue { font-size:12.5px; color:var(--text-primary); line-height:1.5; margin-bottom:3px; white-space:pre-wrap; }
  .note-row .nr-remarks { font-size:11.5px; color:var(--text-dim); white-space:pre-wrap; }
  .note-row .nr-updated { font-size:10.5px; color:#aaa; margin-top:4px; }

  /* ── 일간/주간/월간 계획 공통 */
  .plan-nav { display:flex; align-items:center; justify-content:space-between; background:var(--navy); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .plan-nav-btn { background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:8px; font-size:15px; }
  .plan-nav-label { color:#fff; font-weight:800; font-size:14px; }
  .plan-nav-save { color:rgba(255,255,255,.6); font-size:10.5px; margin-top:2px; }

  .proc-block { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .proc-block-head { padding:9px 14px; color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:space-between; }
  .proc-block-head .pb-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .proc-block-head .pb-chip { background:rgba(255,255,255,.2); border-radius:8px; padding:2px 8px; font-size:10.5px; font-weight:600; }
  .proc-row-item { padding:10px 14px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .proc-row-item:last-child { border-bottom:none; }
  .proc-row-item .pri-top { display:flex; gap:10px; margin-bottom:3px; }
  .proc-row-item .pri-model { font-family:var(--font-mono); font-weight:800; }
  .proc-row-item .pri-qty { color:var(--text-dim); }
  .proc-row-item .pri-person { color:var(--accent2); font-weight:700; }
  .proc-row-item .pri-content { color:var(--text-secondary); white-space:pre-wrap; }
  .proc-empty { padding:16px 14px; text-align:center; color:#ccc; font-size:11.5px; }

  .plan-model-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; padding:12px 14px; }
  .plan-model-card.done { border:2px solid var(--green); }
  .plan-model-card .pmc-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .plan-model-card .pmc-name { font-family:var(--font-mono); font-weight:800; color:var(--orange); font-size:15px; }
  .plan-model-card .pmc-plan { font-size:11px; color:var(--text-dim); }
  .plan-bars { display:flex; gap:10px; }
  .plan-bars .pb-item { flex:1; text-align:center; }
  .plan-bars .pb-item .pbi-label { font-size:10px; color:var(--text-dim); }
  .plan-bars .pb-item .pbi-val { font-family:var(--font-mono); font-weight:800; font-size:14px; margin:2px 0; }
  .plan-bars .pb-item .pbi-bar-bg { height:5px; border-radius:3px; background:var(--bg-card2); overflow:hidden; }
  .plan-bars .pb-item .pbi-bar-fill { height:100%; border-radius:3px; }

  /* ── 계획대비실적 */
  .perf-stat-row { display:flex; gap:8px; margin-bottom:12px; }
  .perf-stat-box { flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 6px; text-align:center; }
  .perf-stat-box.rate { background:#eaf3fb; border-color:var(--accent2); }
  .perf-stat-box .psb-label { font-size:10.5px; color:var(--text-dim); font-weight:700; margin-bottom:4px; }
  .perf-stat-box .psb-value { font-family:var(--font-mono); font-size:19px; font-weight:800; }
  .perf-item-row { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .perf-item-row:last-child { border-bottom:none; }
  .perf-item-row .pir-name { font-family:var(--font-mono); font-weight:700; }
  .perf-item-row .pir-nums { font-family:var(--font-mono); color:var(--text-dim); }
  .perf-item-row .pir-rate { font-weight:800; }

  /* ── 결품리스트 */
  .shortage-info { font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  .sort-chip-row { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; -webkit-overflow-scrolling:touch; }
  .sort-chip { flex-shrink:0; padding:6px 12px; border-radius:14px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-dim); font-size:11.5px; font-weight:700; }
  .sort-chip.active { background:var(--navy); border-color:var(--navy); color:#fff; }
  .shortage-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .shortage-card .sc-top { display:flex; justify-content:space-between; align-items:baseline; }
  .shortage-card .sc-comp { font-size:13px; font-weight:700; }
  .shortage-card .sc-qty { font-family:var(--font-mono); font-weight:800; color:var(--red); }
  .shortage-card .sc-order { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .shortage-card .sc-row2 { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:3px; }
  .shortage-card .sc-note { font-size:11px; color:var(--text-secondary); margin-top:4px; }

  /* ── 완료 히스토리 */
  .hist-toggle-btn { display:block; width:100%; text-align:center; padding:11px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; font-size:13px; font-weight:700; color:var(--text-secondary); margin:16px 0 10px; }
  .hist-section { display:none; }
  .hist-section.open { display:block; }
  .hist-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; }
  .hist-card .hc-top { display:flex; justify-content:space-between; align-items:center; }
  .hist-card .hc-name { font-family:var(--font-mono); font-weight:800; color:var(--orange); font-size:14px; }
  .hist-card .hc-badge { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:8px; background:var(--green-dim); color:var(--green); }
  .hist-card .hc-badge.fail { background:var(--yellow-dim); color:var(--yellow); }
  .hist-card .hc-full { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .hist-card .hc-nums { font-size:11.5px; color:var(--text-secondary); margin-top:5px; }
  .hist-card .hc-carried { display:inline-block; margin-top:5px; font-size:10.5px; font-weight:700; color:var(--orange); border:1px solid var(--orange); border-radius:12px; padding:2px 9px; }
  .stat-box .stat-pct { font-family:var(--font-mono); font-size:10.5px; font-weight:800; color:var(--text-dim); margin-top:2px; }
  .mobile-note-overlay { display:none; position:fixed; inset:0; z-index:650; background:rgba(0,0,0,.62); align-items:flex-end; justify-content:center; }
  .mobile-note-overlay.open { display:flex; }
  .mobile-note-modal { width:100%; max-width:560px; max-height:82vh; background:var(--bg-panel); border-radius:18px 18px 0 0; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 -10px 30px rgba(0,0,0,.25); }
  .mobile-note-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--navy); color:#fff; }
  .mobile-note-title { font-size:15px; font-weight:800; }
  .mobile-note-close { width:30px; height:30px; border-radius:15px; border:none; background:rgba(255,255,255,.14); color:#fff; font-size:15px; }
  .mobile-note-model { padding:10px 16px; background:#fff; border-bottom:1px solid var(--border); }
  .mobile-note-model-name { font-family:var(--font-mono); font-weight:800; color:var(--orange); font-size:15px; }
  .mobile-note-model-full { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .mobile-note-body { flex:1; overflow-y:auto; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); }
  .mobile-note-item { background:#fff; border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  .mobile-note-item:last-child { margin-bottom:0; }
  .mobile-note-item-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .mobile-note-status { font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:10px; background:var(--bg-card2); }
  .mobile-note-defect { font-family:var(--font-mono); font-size:11px; font-weight:800; color:var(--red); }
  .mobile-note-issue { font-size:13px; line-height:1.55; color:var(--text-primary); white-space:pre-wrap; word-break:break-word; }

let PROC_SETS = {

function parseLocalDate(dateStr) {
  if (!dateStr) return new Date(NaN);
  const s = String(dateStr).replace(/^'+/, '').trim().split('T')[0].substring(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(NaN);
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return new Date(NaN);
  return new Date(y, m - 1, d);
}

let customWorkdays = new Set();
function isCustomWorkday(date) {
  const k = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return customWorkdays.has(k);
}
function calcDday(shipDate) {
  const today = new Date(); today.setHours(0,0,0,0);
  const ship  = parseLocalDate(shipDate); ship.setHours(0,0,0,0);
  if (isNaN(ship)) return null;
  if (ship.getTime() === today.getTime()) return 0;
  const dir = ship > today ? 1 : -1;
  let count = 0;
  let cur = new Date(today);
  while (cur.getTime() !== ship.getTime()) {
    cur.setDate(cur.getDate() + dir);
    if (isCustomWorkday(cur)) count++;
  }
  return dir * count || dir;
}

function calcCkdCompletedSites(m) {
  const procSet = PROC_SETS[m.procSet] || [];
  const siteCount = m.plan || 0;
  let completedSites = siteCount > 0 ? Infinity : 0;
  procSet.forEach(p => {
    if (m.excludedProcs && m.excludedProcs.includes(p.id)) return;
    const need = p.crateQty || 1;
    const done = (m.procs && m.procs[p.id]) || 0;
    completedSites = Math.min(completedSites, Math.floor(done / need));
  });
  if (!isFinite(completedSites)) completedSites = 0;
  return Math.min(completedSites, siteCount);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isScheduleActive(img) {
  if (!img.startDate && !img.endDate) return false;
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  if (img.startDate && todayStr < img.startDate) return false;
  if (img.endDate && todayStr > img.endDate) return false;
  return true;
}

function renderGallerySection() {
  const meta = mobileData.sharedImagesMeta || [];
  if (meta.length === 0) return '';
  const chips = meta.map(img => {
    const active = isScheduleActive(img);
    return `<div class="gallery-chip ${active?'active-schedule':''}" onclick="openImageView('${img.id}')">${active?'🟠':'🖼'} ${escapeHtml(img.title)}</div>`;
  }).join('');
  return `<div class="section-title">🖼 등록된 이미지</div><div class="gallery-row">${chips}</div>`;
}

async function openImageView(id) {
  const meta = (mobileData.sharedImagesMeta || []).find(m => m.id === id);
  if (!meta) return;
  document.getElementById('ivTitle').textContent = meta.title || '이미지';
  document.getElementById('ivDesc').textContent = meta.desc || '';
  const dt = meta.uploadedAt ? new Date(meta.uploadedAt).toLocaleString('ko-KR') : '';
  document.getElementById('ivMeta').textContent = `등록: ${meta.uploadedBy || '익명'} · ${dt}`;
  document.getElementById('ivBody').innerHTML = '<div style="color:#aaa;font-size:13px;">불러오는 중...</div>';
  document.getElementById('imageViewOverlay').classList.add('open');
  try {
    const res  = await fetch(GS_URL + '?action=load_shared_image&id=' + encodeURIComponent(id));
    const json = await res.json();
    if (json.status === 'ok' && json.data && json.data.imageData) {
      document.getElementById('ivBody').innerHTML = `<img src="${json.data.imageData}">`;
    } else {
      document.getElementById('ivBody').innerHTML = '<div style="color:#aaa;font-size:13px;">이미지를 불러오지 못했습니다.</div>';
    }
  } catch(e) {
    console.error('load_shared_image 실패:', e);
    document.getElementById('ivBody').innerHTML = '<div style="color:#aaa;font-size:13px;">이미지를 불러오지 못했습니다.</div>';
  }
}

function closeImageView() {
  document.getElementById('imageViewOverlay').classList.remove('open');
  document.getElementById('ivBody').innerHTML = '';
}

// 자동 팝업: 진입 시 일정이 활성화된 이미지가 있으면 자동으로 하나 띄움 (한 세션에 한 번만)
let autoShownImageIds = new Set();
function checkAutoPopupImages() {
  if (!mobileData || !mobileData.sharedImagesMeta) return;
  const toShow = mobileData.sharedImagesMeta.filter(img => isScheduleActive(img) && !autoShownImageIds.has(img.id));
  if (toShow.length > 0) {
    autoShownImageIds.add(toShow[0].id);
    openImageView(toShow[0].id);
  }
}

function calcCkdInspectSites(m) {
  const p = (PROC_SETS[m.procSet] || []).find(x => (x.name||'').includes('수입검사') || (x.name||'').includes('수검') || (x.short||'').includes('수입검사') || (x.short||'').includes('수검'));
  if (!p) return 0;
  if (m.excludedProcs && m.excludedProcs.includes(p.id)) return 0;
  const need = p.crateQty || 1;
  const done = (m.procs && m.procs[p.id]) || 0;
  return Math.min(Math.floor(done / need), m.plan || 0);
}
function calcActualQty(m) {
  const isCkd = m.procSet && m.procSet.indexOf('CKD') === 0;
  if (isCkd) return { qty: calcCkdCompletedSites(m), unit: 'Site' };
  return { qty: (m.procs && m.procs['pack']) || 0, unit: '대' };
}
function getDdayDisplay(shipDate) {
  const ddayNum = shipDate ? calcDday(shipDate) : null;
  if (ddayNum === null) return { text: '미설정', color: 'var(--text-dim)' };
  if (ddayNum > 0)  return { text: `D-${ddayNum}`, color: ddayNum <= 5 ? '#ff66aa' : ddayNum <= 10 ? 'var(--yellow)' : 'var(--green)' };
  if (ddayNum === 0) return { text: 'D-DAY', color: 'var(--red)' };
  return { text: `D+${Math.abs(ddayNum)}`, color: 'var(--red)' };
}
function getHistYearMonth(m) {
  if (m.shipYear && m.shipMonth) return { year: m.shipYear, month: m.shipMonth };
  const sd = m.shipDate ? new Date(String(m.shipDate).replace(/^'+/, '')) : null;
  if (sd && !isNaN(sd)) return { year: sd.getFullYear(), month: sd.getMonth() + 1 };
  const cd = m.completedAt ? new Date(m.completedAt) : null;
  if (cd && !isNaN(cd)) return { year: cd.getFullYear(), month: cd.getMonth() + 1 };
  return { year: null, month: null };
}

// ══════════════════════ 특이사항 ══════════════════════
function renderNoteTab() {
  const container = document.getElementById('view-note');
  const models = mobileData.models || [];
  const modelsWithNotes = models.filter(m => m.noteData && m.noteData.length > 0);
  modelsWithNotes.sort((a,b) => {
    const aCkd = a.procSet && a.procSet.indexOf('CKD')===0, bCkd = b.procSet && b.procSet.indexOf('CKD')===0;
    if (aCkd !== bCkd) return aCkd ? 1 : -1;
    const da = a.shipDate ? calcDday(a.shipDate) : Infinity, db = b.shipDate ? calcDday(b.shipDate) : Infinity;
    return da - db;
  });
  if (modelsWithNotes.length === 0) { container.innerHTML = '<div class="empty-note">등록된 특이사항이 없습니다</div>'; return; }

  const statusBg = { 'In Progress':'rgba(255,200,0,.13)', 'On Hold':'rgba(150,150,150,.13)', 'Completed':'rgba(0,170,85,.1)', 'Urgent':'rgba(221,17,51,.1)' };
  const statusColor = { 'In Progress':'var(--yellow)', 'On Hold':'var(--text-dim)', 'Completed':'var(--green)', 'Urgent':'var(--red)' };

  let html = '';
  modelsWithNotes.forEach(m => {
    const defectTotal = m.noteData.reduce((s,r) => s + (parseInt(r.defectQty)||0), 0);
    const dday = getDdayDisplay(m.shipDate);
    html += `
      <div class="note-model-card">
        <div class="note-model-head">
          <span class="nm-name">${escapeHtml(m.model)}${m.fullName?` <span style="font-size:11px;color:var(--text-dim);font-weight:600;">(${escapeHtml(m.fullName)})</span>`:''}</span>
          <span class="nm-stat">계획 ${m.plan}</span>
          <span class="nm-stat" style="color:var(--accent2);">포장 ${(m.procs&&m.procs.pack)||0}</span>
          ${defectTotal>0?`<span class="nm-stat" style="color:var(--red);">문제 ${defectTotal}</span>`:''}
          <span class="nm-stat" style="margin-left:auto;font-family:var(--font-mono);color:${dday.color};">${dday.text}</span>
        </div>
        ${m.noteData.map(r => `
          <div class="note-row" style="background:${statusBg[r.status]||''};">
            <div class="nr-top">
              <span class="nr-status" style="background:rgba(0,0,0,.06);color:${statusColor[r.status]||'var(--text-primary)'};">${r.status||'-'}</span>
              ${r.defectQty?`<span class="nr-qty">문제수량 ${r.defectQty}</span>`:''}
            </div>
            <div class="nr-issue">${escapeHtml(r.issue||'')}</div>
            ${r.remarks?`<div class="nr-remarks">${escapeHtml(r.remarks)}</div>`:''}
            ${r.lastUpdated?`<div class="nr-updated">${escapeHtml(r.lastUpdated)}</div>`:''}
          </div>
        `).join('')}
      </div>
    `;
  });
  container.innerHTML = html;
}

// ══════════════════════ 일간계획 ══════════════════════
function dateKeyMobile(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
let currentAssignmentDate = dateKeyMobile(new Date());
let mobilePersonnelList = [];
let mobilePnProcesses = [ { key:'sub',label:'SUB 조립',color:'#1f5f74' },{ key:'main',label:'MAIN 조립',color:'#e8792a' },{ key:'inspect',label:'검사',color:'#1a6b3a' },{ key:'pack',label:'포장',color:'#29a8e0' } ];

function changeAssignmentDate(delta) {
  const d = parseLocalDate(currentAssignmentDate);
  d.setDate(d.getDate() + delta);
  currentAssignmentDate = dateKeyMobile(d);
  renderPersonnelTab();
}

async function renderPersonnelTab() {
  const container = document.getElementById('view-personnel');
  mobilePersonnelList = mobileData.personnel || [];
  if (Array.isArray(mobileData.personnelProcesses) && mobileData.personnelProcesses.length>0) mobilePnProcesses = mobileData.personnelProcesses;

  const dateObj = parseLocalDate(currentAssignmentDate);
  const dowStr = ['일','월','화','수','목','금','토'][dateObj.getDay()];
  const isToday = currentAssignmentDate === dateKeyMobile(new Date());

  container.innerHTML = `<div class="plan-nav"><button class="plan-nav-btn" onclick="changeAssignmentDate(-1)">◀</button><div style="text-align:center;"><div class="plan-nav-label">${currentAssignmentDate} (${dowStr})</div></div><button class="plan-nav-btn" onclick="changeAssignmentDate(1)">▶</button></div><div id="pnBody" style="text-align:center;padding:30px;color:var(--text-dim);font-size:12px;">불러오는 중...</div>`;

  let assignment = null;
  if (isToday && mobileData.todayAssignment) {
    assignment = mobileData.todayAssignment.data;
  } else {
    try {

function getMondayOf(d) { const dt=new Date(d); const day=dt.getDay(); const diff=(day===0?-6:1-day); dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
let currentWeekStart = dateKeyMobile(getMondayOf(new Date()));

function changeWeek(delta) {
  const d = parseLocalDate(currentWeekStart);
  d.setDate(d.getDate() + delta*7);
  currentWeekStart = dateKeyMobile(d);
  renderWeekTab();
}
function getWeekLabelMobile(weekStartStr) {
  const start = parseLocalDate(weekStartStr);
  const firstOfMonth = new Date(start.getFullYear(), start.getMonth(), 1);
  const firstMonday = getMondayOf(firstOfMonth);
  const weekNum = Math.floor((start - firstMonday) / (7*86400000)) + 1;
  return `${start.getMonth()+1}월 ${weekNum}주차`;
}

let perfYear = new Date().getFullYear();
let perfMonth = new Date().getMonth()+1;

function changePerfMonth(delta) {
  perfMonth += delta;
  if (perfMonth > 12) { perfMonth = 1; perfYear++; }
  if (perfMonth < 1) { perfMonth = 12; perfYear--; }
  renderPerfTab();
}

function computePerfMobile(year, month) {
  const antGroups = {}, ckdGroups = {};
  function addToGroup(groups, m, actual, unit) {
    const key = m.model || '(모델명 없음)';
    if (!groups[key]) groups[key] = { plan:0, actual:0, unit };
    groups[key].plan += (m.plan||0);
    groups[key].actual += actual;
  }
  (mobileData.history || []).forEach(h => {
    const ym = getHistYearMonth(h);
    if (ym.year !== year || ym.month !== month) return;
    const isCkd = h.procSet && h.procSet.indexOf('CKD')===0;
    const { qty, unit } = calcActualQty(h);
    addToGroup(isCkd?ckdGroups:antGroups, h, qty, unit);
  });
  (mobileData.models || []).forEach(m => {
    if (!m.shipDate) return;
    const sd = parseLocalDate(m.shipDate);
    if (isNaN(sd) || sd.getFullYear()!==year || sd.getMonth()+1!==month) return;
    const isCkd = m.procSet && m.procSet.indexOf('CKD')===0;
    const { qty, unit } = calcActualQty(m);
    addToGroup(isCkd?ckdGroups:antGroups, m, qty, unit);
  });
  return { ant: antGroups, ckd: ckdGroups };
}

function renderPerfSection(title, groups) {
  const keys = Object.keys(groups).sort();
  let totalPlan=0, totalActual=0;
  keys.forEach(k => { totalPlan += groups[k].plan; totalActual += groups[k].actual; });
  const rate = totalPlan>0 ? Math.round(totalActual/totalPlan*100) : 0;
  const unit = keys.length>0 ? groups[keys[0]].unit : '';
  let html = `<div class="section-title">${title}</div>`;
  html += `<div class="perf-stat-row">
    <div class="perf-stat-box"><div class="psb-label">총 계획</div><div class="psb-value">${totalPlan}<span style="font-size:10px;">${unit}</span></div></div>
    <div class="perf-stat-box"><div class="psb-label">총 실적</div><div class="psb-value" style="color:var(--accent2);">${totalActual}<span style="font-size:10px;">${unit}</span></div></div>
    <div class="perf-stat-box rate"><div class="psb-label">달성률</div><div class="psb-value" style="color:var(--accent2);">${rate}%</div></div>
  </div>`;
  if (keys.length === 0) { html += '<div class="empty-note">해당 월 데이터가 없습니다</div>'; return html; }
  html += `<div class="proc-block">`;
  keys.forEach(k => {
    const g = groups[k];
    const r = g.plan>0 ? Math.round(g.actual/g.plan*100) : 0;
    html += `<div class="perf-item-row"><span class="pir-name">${escapeHtml(k)}</span><span class="pir-nums">${g.actual} / ${g.plan}${g.unit}</span><span class="pir-rate" style="color:${r>=100?'var(--green)':r>=70?'var(--yellow)':'var(--red)'};">${r}%</span></div>`;
  });
  html += `</div>`;
  return html;
}

function renderPerfTab() {
  const container = document.getElementById('view-perf');
  const data = computePerfMobile(perfYear, perfMonth);
  let html = `<div class="plan-nav"><button class="plan-nav-btn" onclick="changePerfMonth(-1)">◀</button><div class="plan-nav-label">${perfYear}년 ${perfMonth}월</div><button class="plan-nav-btn" onclick="changePerfMonth(1)">▶</button></div>`;
  html += renderPerfSection('★ ANT (안테나)', data.ant);
  html += renderPerfSection('📦 CKD (미국공장 포장출하)', data.ckd);
  container.innerHTML = html;
}

const SHORTAGE_COLS = [
  { key:'line', label:'LINE' }, { key:'order', label:'Order' }, { key:'comp', label:'Comp.' },
  { key:'desc', label:'Desc.' }, { key:'qty', label:'Qty.' }, { key:'date', label:'Date' },
];
let shortageSort = { col:null, dir:'asc' };
function setShortageSort(col) {
  if (shortageSort.col === col) shortageSort.dir = shortageSort.dir==='asc'?'desc':'asc';
  else shortageSort = { col, dir:'asc' };

}

function renderShortageTab() {
  const container = document.getElementById('view-shortage');
  const shortageData = mobileData.shortage || { items:[] };
  const items = (shortageData.items || []).slice();

  let infoHtml;
  if (shortageData.fileName) {
    const dt = shortageData.uploadedAt ? new Date(shortageData.uploadedAt).toLocaleString('ko-KR') : '';
    infoHtml = `<div class="shortage-info"><b>${escapeHtml(shortageData.fileName)}</b> · ${items.length}건 · ${escapeHtml(shortageData.uploadedBy||'익명')} 업로드 · ${dt}</div>`;
  } else {
    infoHtml = `<div class="shortage-info">업로드된 결품리스트가 없습니다</div>`;
  }

  const sortBar = `<div class="sort-chip-row">${SHORTAGE_COLS.map(c => {
    const active = shortageSort.col === c.key;
    const arrow = active ? (shortageSort.dir==='asc'?' ▲':' ▼') : '';
    return `<button class="sort-chip ${active?'active':''}" onclick="setShortageSort('${c.key}')">${c.label}${arrow}</button>`;
  }).join('')}</div>`;

  if (shortageSort.col) {
    const col = shortageSort.col, dir = shortageSort.dir;
    items.sort((a,b) => {
      let av=a[col], bv=b[col];
      if (col==='qty') { av=parseFloat(av)||0; bv=parseFloat(bv)||0; }
      else { av=String(av||''); bv=String(bv||''); }
      const cmp = av>bv?1:av<bv?-1:0;
      return dir==='asc'?cmp:-cmp;
    });
  }

  let html = infoHtml + sortBar;
  if (items.length === 0) { html += '<div class="empty-note">등록된 결품리스트가 없습니다</div>'; container.innerHTML = html; return; }
  items.forEach(it => {
    html += `

        <div class="sc-row2"><span>${escapeHtml(it.desc||'')}</span><span>${escapeHtml(it.date||'')}</span></div>
        ${it.note?`<div class="sc-note">📝 ${escapeHtml(it.note)}</div>`:''}
      </div>
    `;
  });
  container.innerHTML = html;
}

  if (antModels.length === 0) {
    html += `<div class="empty-note">등록된 ANT 모델이 없습니다</div>`;
  } else {
    antModels.forEach((m, idx) => html += buildModelCard(m, 'ant', 'ant_'+idx));
  }

  // ── CKD 모델
  let ckdTotalPlan=0, ckdTotalInspect=0, ckdTotalDone=0;
  ckdModels.forEach(m => {
    ckdTotalPlan += m.plan||0;
    ckdTotalInspect += calcCkdInspectSites(m);
    ckdTotalDone += calcCkdCompletedSites(m);
  });
  history.forEach(h => {
    if (!(h.procSet && h.procSet.indexOf('CKD') === 0)) return;
    const ym = getHistYearMonth(h);
    if (ym.year !== curYear || ym.month !== curMonth) return;
    ckdTotalPlan += h.plan || 0;
    ckdTotalInspect += calcCkdInspectSites(h);
    ckdTotalDone += calcCkdCompletedSites(h);
  });

  const ckdInspectPct = ckdTotalPlan > 0 ? Math.round(ckdTotalInspect / ckdTotalPlan * 100) : 0;
  const ckdDonePct    = ckdTotalPlan > 0 ? Math.round(ckdTotalDone    / ckdTotalPlan * 100) : 0;
  html += `<div class="section-title">📦 CKD (미국공장 포장출하)</div>`;
  html += `
    <div class="stat-strip">
      <div class="stat-box"><div class="stat-label">총 계획</div><div class="stat-value">${ckdTotalPlan}<span style="font-size:10px;">Site</span></div><div class="stat-pct">기준 100%</div></div>
      <div class="stat-box"><div class="stat-label">수검 완료</div><div class="stat-value">${ckdTotalInspect}<span style="font-size:10px;">Site</span></div><div class="stat-pct">${ckdInspectPct}%</div></div>
      <div class="stat-box"><div class="stat-label">포장 완료</div><div class="stat-value accent">${ckdTotalDone}<span style="font-size:10px;">Site</span></div><div class="stat-pct">${ckdDonePct}%</div></div>
    </div>
  `;

  if (ckdModels.length === 0) {
    html += `<div class="empty-note">등록된 CKD 모델이 없습니다</div>`;
  } else {
    ckdModels.forEach((m, idx) => html += buildModelCard(m, 'ckd', 'ckd_'+idx));
  }

  // ── 완료 히스토리 (접이식)
  html += `<button class="hist-toggle-btn" onclick="toggleHistorySection()">${histSectionOpen?'✓ 완료 히스토리 접기 ▴':'✓ 완료 히스토리 보기 ▾'}</button>`;
  html += `<div class="hist-section ${histSectionOpen?'open':''}" id="histSection">${histSectionOpen ? buildHistorySectionHtml() : ''}</div>`;

  container.innerHTML = html;
}

let histSectionOpen = false;
let histCategory = 'all';
let histMonth = 0;

function toggleHistorySection() {
  histSectionOpen = !histSectionOpen;
  renderProdTab();
}
function setHistCategory(c) { histCategory = c; document.getElementById('histSection').innerHTML = buildHistorySectionHtml(); }
function setHistMonth(m) { histMonth = m; document.getElementById('histSection').innerHTML = buildHistorySectionHtml(); }

function buildHistorySectionHtml() {
  const allHistory = mobileData.history || [];
  let filtered = allHistory.filter(h => {
    if (histCategory === 'all') return true;
    const isCkd = h.procSet && h.procSet.indexOf('CKD') === 0;
    return histCategory === 'ckd' ? isCkd : !isCkd;
  });

  const months = [...new Set(filtered.map(h => getHistYearMonth(h).month).filter(Boolean))].sort((a,b)=>b-a);
  let html = `<div class="sort-chip-row">${[['all','전체'],['ant','ANT'],['ckd','CKD']].map(([c,label]) =>
    `<button class="sort-chip ${histCategory===c?'active':''}" onclick="setHistCategory('${c}')">${label}</button>`
  ).join('')}</div>`;
  html += `<div class="sort-chip-row">
    <button class="sort-chip ${histMonth===0?'active':''}" onclick="setHistMonth(0)">전체</button>
    ${months.map(mo => `<button class="sort-chip ${histMonth===mo?'active':''}" onclick="setHistMonth(${mo})">${mo}월</button>`).join('')}
  </div>`;

  if (histMonth !== 0) filtered = filtered.filter(h => getHistYearMonth(h).month === histMonth);
  filtered = filtered.slice().sort((a,b) => new Date(b.completedAt||0) - new Date(a.completedAt||0));

  if (filtered.length === 0) { html += '<div class="empty-note">완료 처리된 모델이 없습니다</div>'; return html; }

  filtered.forEach(h => {
    const { qty, unit } = calcActualQty(h);
    const rate = h.plan > 0 ? Math.round(qty/h.plan*100) : 0;
    const histNoteCount = Array.isArray(h.noteData) ? h.noteData.length : 0;
    const histNoteIdx = histNoteCount > 0 ? registerMobileNoteItem(h) : -1;
    html += `
      <div class="hist-card">
        <div class="hc-top">
          <span class="hc-name">${escapeHtml(h.model)}</span>
          <span class="hc-badge ${rate<100?'fail':''}">${rate>=100?'✔ 완료':'⚠ 미달성'}</span>
        </div>
        ${h.fullName?`<div class="hc-full">${escapeHtml(h.fullName)}</div>`:''}
        <div class="hc-nums">계획 ${h.plan}${unit} · 실적 ${qty}${unit} (${rate}%) · 완료일 ${escapeHtml(h.completedDate||'-')}</div>
        ${h.carriedOver?`<span class="hc-carried">📦 이월</span>`:''}
        ${histNoteCount > 0 ? `<button class="hist-note-btn" onclick="openMobileNotePopup(${histNoteIdx})">⚠️ 특이사항 ${histNoteCount}건 보기</button>` : ''}
      </div>
    `;
  });
  return html;
}


function buildModelCard(m, kind, key) {
  const ddayNum = m.shipDate ? calcDday(m.shipDate) : null;
  let ddayText = '미설정', ddayColor = 'var(--text-primary)';
  if (ddayNum !== null) {
    if (ddayNum > 0) ddayText = `D-${ddayNum}`;
    else if (ddayNum === 0) ddayText = 'D-DAY';
    else { ddayText = `D+${Math.abs(ddayNum)}`; ddayColor = 'var(--red)'; }
  }
  const sd = m.shipDate ? parseLocalDate(m.shipDate) : null;
  const dateStr = (sd && !isNaN(sd)) ? `${sd.getFullYear()}.${String(sd.getMonth()+1).padStart(2,'0')}.${String(sd.getDate()).padStart(2,'0')}` : '-';

  const noteCount = Array.isArray(m.noteData) ? m.noteData.length : 0;
  const noteIdx = noteCount > 0 ? registerMobileNoteItem(m) : -1;
  const isExpanded = expandedCardKeys.has(key);

  let progressHtml = '';
  let qtyBadge = '';

  if (kind === 'ant') {
    const mainDone = (m.procs && m.procs.main) || 0;
    const finalDone = (m.procs && m.procs.final) || 0;
    const packDone = (m.procs && m.procs.pack) || 0;
    const plan = m.plan || 1;
    const mainPct = Math.min(100, Math.round(mainDone/plan*100));
    const finalPct = Math.min(100, Math.round(finalDone/plan*100));
    const packPct = Math.min(100, Math.round(packDone/plan*100));
    qtyBadge = `${m.plan}대`;
    progressHtml = `
      <div class="model-card-progress">
        <div class="progress-mini">
          <div class="pm-label">조립 완료</div>
          <div class="pm-value">${mainDone} / ${m.plan} · ${mainPct}%</div>
          <div class="pm-bar-bg"><div class="pm-bar-fill" style="width:${mainPct}%;"></div></div>
        </div>
        <div class="progress-mini">
          <div class="pm-label">검사 완료</div>
          <div class="pm-value">${finalDone} / ${m.plan} · ${finalPct}%</div>
          <div class="pm-bar-bg"><div class="pm-bar-fill" style="width:${finalPct}%;background:var(--green);"></div></div>
        </div>
        <div class="progress-mini">
          <div class="pm-label">포장 완료</div>
          <div class="pm-value">${packDone} / ${m.plan} · ${packPct}%</div>
          <div class="pm-bar-bg"><div class="pm-bar-fill" style="width:${packPct}%;background:var(--accent2);"></div></div>
        </div>
      </div>
    `;
  } else {
    const doneSites = calcCkdCompletedSites(m);
    const plan = m.plan || 1;
    const pct = Math.min(100, Math.round(doneSites/plan*100));
    qtyBadge = `${m.plan} Site`;
    progressHtml = `
      <div class="model-card-progress">
        <div class="progress-mini">
          <div class="pm-label">포장 완료</div>
          <div class="pm-value">${doneSites} / ${m.plan} Site</div>
          <div class="pm-bar-bg"><div class="pm-bar-fill" style="width:${pct}%;background:var(--accent2);"></div></div>
        </div>
      </div>
    `;
  }

  // 상세 공정 목록 (펼쳤을 때)
  const procSet = PROC_SETS[m.procSet] || [];
  let detailRows = '';
  procSet.forEach(p => {
    const excluded = m.excludedProcs && m.excludedProcs.includes(p.id);
    const done = (m.procs && m.procs[p.id]) || 0;
    let valStr, valClass = '';
    if (excluded) { valStr = 'N/A'; valClass = 'na'; }
    else if (kind === 'ckd') {
      const need = p.crateQty || 1;
      const siteEq = Math.floor(done / need);
      valStr = `${done} (${siteEq}/${m.plan} Site)`;
    } else {
      valStr = `${done} / ${m.plan}`;
    }
    detailRows += `<div class="detail-proc-row"><span class="detail-proc-name">${escapeHtml(p.short || p.name)}</span><span class="detail-proc-val ${valClass}">${valStr}</span></div>`;
  });

  return `
    <div class="model-card">
      <div class="model-card-head">
        <div>
          <div class="model-card-name">${escapeHtml(m.model)}</div>
          ${m.fullName ? `<div class="model-card-fullname">${escapeHtml(m.fullName)}</div>` : ''}
        </div>
        <div class="model-card-qty">${qtyBadge}</div>
      </div>
      <div class="model-card-dday-row">
        <span>포장기준일 ${dateStr}</span>
        <span class="model-card-dday" style="color:${ddayColor};">${ddayText}</span>
      </div>
      ${progressHtml}
      ${noteCount > 0 ? `<button class="model-card-note-btn" onclick="openMobileNotePopup(${noteIdx})" style="display:block;width:calc(100% - 28px);background:rgba(221,17,51,.08);color:var(--red);border:1px solid rgba(221,17,51,.3);">⚠️ 특이사항 ${noteCount}건 보기</button>` : ''}
      <button class="model-card-expand-btn" onclick="toggleCardDetail('${key}')">${isExpanded ? '공정별 상세 접기 ▴' : '공정별 상세 보기 ▾'}</button>
      <div class="model-card-detail ${isExpanded?'open':''}">${detailRows}</div>
    </div>
  `;
}

async function loadMobileData() {
  try {
    const res  = await fetch(GS_URL + '?action=load');
    const json = await res.json();
    if (json.status === 'ok') {
      mobileData = json.data;
      document.getElementById('topbarSub').textContent = '연동됨 · 방금 갱신';
      renderMobileTab(currentMobileTab);
      checkAutoPopupImages();
    }
  } catch(e) {
    console.error('load 실패:', e);
    document.getElementById('topbarSub').textContent = '연동 실패 — 새로고침 해주세요';
  }
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  await loadMobileData();
  setTimeout(() => btn.classList.remove('spin'), 700);
}

// ── 접속 잠금 (PC와 동일 로직)
async function checkViewLockAndStart() {
  if (localStorage.getItem('kaa_view_unlocked') === '1') { startMobileApp(); return; }
  try {
    const res  = await fetch(GS_URL + '?action=check_view_lock');
    const json = await res.json();
    if (json.status === 'ok' && json.data && json.data.enabled) {
      document.getElementById('viewLockOverlay').style.display = 'flex';
      const input = document.getElementById('viewLockPasswordInput');
      setTimeout(() => input.focus(), 100);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submitViewLockPassword(); });
    } else {
      localStorage.setItem('kaa_view_unlocked', '1');
      startMobileApp();
    }
  } catch(e) {
    console.error('check_view_lock 실패, 안전하게 그냥 실행:', e);
    startMobileApp();
  }
}

async function submitViewLockPassword() {
  const pw = document.getElementById('viewLockPasswordInput').value;
  const errEl = document.getElementById('viewLockError');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = '비밀번호를 입력해주세요.'; return; }
  try {
    const res  = await fetch(GS_URL, { method:'POST', body: JSON.stringify({ action:'verify_view_password', data:{ password: pw } }) });
    const json = await res.json();
    if (json.status === 'ok' && json.data && json.data.valid) {
      localStorage.setItem('kaa_view_unlocked', '1');
      document.getElementById('viewLockOverlay').style.display = 'none';
      startMobileApp();
    } else {
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
      document.getElementById('viewLockPasswordInput').value = '';
    }
  } catch(e) {
    errEl.textContent = '확인 중 오류가 발생했습니다.';
  }
}

function startMobileApp() {
  loadMobileData();
  setInterval(loadMobileData, 30000); // 30초마다 자동 갱신 (PC와 동일 주기)
}

checkViewLockAndStart();
</script>
